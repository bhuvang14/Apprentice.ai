version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: faculty-assistant-db
    environment:
      POSTGRES_DB: faculty_assistant
      POSTGRES_USER: faculty_user
      POSTGRES_PASSWORD: faculty_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty_user -d faculty_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: